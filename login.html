<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Đăng Nhập Hệ Thống</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { indigo: '#6366F1', violet: '#8B5CF6', bgDark: '#090D16' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 dark:bg-[#090D16] text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 relative selection:bg-indigo-500 selection:text-white">

  <!-- Ambient Light Orbs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/20 rounded-full blur-[128px]"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-violet-500/20 rounded-full blur-[128px]"></div>
  </div>

  <!-- Login Card Glassmorphism -->
  <div class="w-full max-w-md p-8 rounded-3xl glass-card border border-white/20 dark:border-white/10 shadow-2xl relative">
    
    <!-- Logo & Brand -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-indigo-500/30">
        T
      </div>
      <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 via-violet-400 to-sky-400">TaskFlow</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Đăng nhập để vào không gian quản lý tiến độ dự án</p>
    </div>

    <!-- Thông báo lỗi (nếu có) -->
    <div id="loginError" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-500 text-xs font-medium text-center"></div>

    <!-- Form Đăng Nhập -->
 feature/projects-page
    <form id="loginForm" onsubmit="return false;" class="space-y-4">
 develop
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Tài khoản Email</label>
        <input type="email" id="loginEmail" required value="admin@taskflow.dev"
               class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-white/5 border border-slate-200 dark:border-white/10 focus:outline-none focus:border-indigo-500 text-sm transition-all">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Mật khẩu</label>
        <input type="password" id="loginPassword" required value="admin123"
               class="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-white/5 border border-slate-200 dark:border-white/10 focus:outline-none focus:border-indigo-500 text-sm transition-all">
      </div>

      <!-- Gợi ý tài khoản demo -->
      <div class="p-3 rounded-xl bg-indigo-500/5 border border-indigo-500/10 text-[11px] text-slate-500 dark:text-slate-400 space-y-1">
        <p>💡 <b>Tài khoản Admin:</b> admin@taskflow.dev | admin123</p>
        <p>💡 <b>Tài khoản Member:</b> member@taskflow.dev | user123</p>
      </div>

 feature/projects-page
      <button type="button" id ="btnLogin" 
 develop
              class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 transition-all">
        Đăng Nhập Ngay
      </button>
    </form>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
 feature/projects-page
    // Chặn submit mặc định của form
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    submitLogin();
  });

  const btnLogin = document.getElementById("btnLogin");
  if (btnLogin) {
    btnLogin.addEventListener("click", submitLogin);
  }

  function submitLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();
    const errBox = document.getElementById("loginError");

    const success = Auth.login(email, password);

    if (success) {
      if (errBox) errBox.classList.add("hidden");
      // Chuyển về trang trước đó đã lưu hoặc mặc định vào index.html
      const nextUrl = sessionStorage.getItem("REDIRECT_AFTER_LOGIN") || "index.html";
      sessionStorage.removeItem("REDIRECT_AFTER_LOGIN");
      window.location.href = nextUrl;
    } else {
      if (errBox) {
        errBox.textContent = "Email hoặc mật khẩu không chính xác!";
        errBox.classList.remove("hidden");
      } else {
        alert("Email hoặc mật khẩu không chính xác!");
      }
    }
  }
 develop
  </script>
</body>
</html>
