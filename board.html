<!DOCTYPE html>
<html lang="vi" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - Bảng Việc Kanban Kéo Thả & Tiến Độ Tự Động</title>
  <meta name="description" content="Quản lý luồng công việc Agile theo phương pháp Kanban kéo thả 60fps với cập nhật tiến độ tức thì" />

  <!-- Anti-Flicker Script: Đặt ngay trong <head> để triệt tiêu chớp giật giao diện -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('taskflow_theme');
        const isDark = savedTheme ? savedTheme === 'dark' : true;
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            main: 'var(--bg-main)',
            surface: 'var(--bg-surface)',
            primary: '#6366F1',
            secondary: '#8B5CF6'
          }
        }
      }
    };
  </script>

  <!-- Custom Styles: Glassmorphism, CSS Grid Kanban, Custom Scrollbar & Keyframe Animations -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-[#F8FAFC] dark:bg-[#090D16] text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased overflow-hidden selection:bg-indigo-500 selection:text-white transition-colors duration-200">

  <!-- ========================================================================
       1. AMBIENT BACKGROUND GLOW ORBS (colorweb.md Section 4)
       ======================================================================== -->
  <div class="ambient-container" aria-hidden="true">
    <div class="ambient-orb-primary"></div>
    <div class="ambient-orb-secondary"></div>
    <div class="ambient-orb-accent"></div>
  </div>

  <!-- ========================================================================
       2. BỐ CỤC KHUNG ỨNG DỤNG (APP SHELL CONTAINER)
       Chỉ sử dụng 2 thẻ giữ chỗ duy nhất để AppLayout.init() nạp động
       ======================================================================== -->
  <div class="flex h-screen overflow-hidden">
    <!-- Vị trí nạp động Sidebar chung -->
    <aside id="app-sidebar"></aside>

    <!-- Khối Nội dung Chính và Header -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
      <!-- Vị trí nạp động Header chung -->
      <header id="app-header"></header>

      <!-- Vùng cuộn nội dung Kanban Workspace -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6 custom-scroll bg-transparent">

        <!-- ====================================================================
             3. THANH ĐIỀU KHIỂN & BỘ LỌC ĐA NĂNG (FILTER & STATS BAR)
             ==================================================================== -->
        <section class="glass-card p-5 sm:p-6 border border-slate-200/90 dark:border-white/10 shadow-sm dark:shadow-xl space-y-4">
          <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
            
            <!-- Nhóm Tìm kiếm & Lọc -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3.5 flex-1 max-w-4xl">
              
              <!-- Ô tìm kiếm thời gian thực (Glow/Shadow, Hover, Gradient, Slide-down) -->
              <div class="search-glow-container flex-1">
                <label for="taskSearchInput" class="sr-only">Tìm kiếm công việc</label>
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input 
                  type="text" 
                  id="taskSearchInput" 
                  name="taskSearch"
                  autocomplete="off"
                  placeholder="Tìm kiếm công việc, người phụ trách, thẻ tag..." 
                  class="search-glow-input"
                />
                <button 
                  id="btnClearTaskSearch" 
                  type="button" 
                  title="Xóa tìm kiếm" 
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden p-1 transition-colors"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>

              <!-- Dropdown lọc theo Dự Án (border-radius: 10px, padding: 10px 14px, focus shadow, cursor pointer) -->
              <div class="relative min-w-[210px]">
                <label for="filterProject" class="sr-only">Lọc theo dự án</label>
                <select 
                  id="filterProject" 
                  name="project"
                  class="select-project-filter w-full"
                >
                  <option value="all">Tất cả dự án</option>
                  <!-- Nạp động qua JS -->
                </select>
              </div>

              <!-- Dropdown lọc theo Mức Độ Ưu Tiên (id="filterPriority", name="priority", value trên option) -->
              <div class="relative min-w-[180px]">
                <label for="filterPriority" class="sr-only">Lọc theo mức độ ưu tiên</label>
                <select 
                  id="filterPriority" 
                  name="priority"
                  class="select-priority-filter w-full"
                >
                  <option value="all">Mọi độ ưu tiên</option>
                  <option value="critical">🚨 Khẩn cấp (Critical)</option>
                  <option value="high">🔥 Cao (High)</option>
                  <option value="medium">⚡ Trung bình (Medium)</option>
                  <option value="low">🌱 Thấp (Low)</option>
                </select>
              </div>

            </div>

            <!-- Nút Thêm Công Việc (Hover, Active, Transition, Focus-visible) -->
            <div class="flex items-center gap-3">
              <button 
                type="button" 
                id="btnOpenCreateTaskModal" 
                class="btn-add-task-primary w-full sm:w-auto"
              >
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                <span>+ Thêm Task Mới</span>
              </button>
            </div>

          </div>

          <!-- Dải KPI & Tiến độ động (Count-up + Thanh chạy mượt + Highlight khi thay đổi) -->
          <div class="pt-3.5 border-t border-slate-200/60 dark:border-white/5 flex flex-wrap items-center justify-between gap-4 text-xs text-slate-600 dark:text-slate-400">
            <div class="flex flex-wrap items-center gap-4 sm:gap-6 font-medium" id="kpi-metrics-container">
              <span class="flex items-center gap-1.5 px-2 py-1 rounded-md transition-all duration-300" id="kpi-stat-total-wrap">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                <span>Tổng cộng: <b id="stat-total-tasks" class="font-bold text-slate-900 dark:text-white font-mono text-sm px-1 rounded transition-colors">0</b></span>
              </span>
              <span class="flex items-center gap-1.5 px-2 py-1 rounded-md transition-all duration-300" id="kpi-stat-todo-wrap">
                <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                <span>Chờ làm: <b id="stat-todo-tasks" class="font-bold text-slate-900 dark:text-white font-mono text-sm px-1 rounded transition-colors">0</b></span>
              </span>
              <span class="flex items-center gap-1.5 px-2 py-1 rounded-md transition-all duration-300" id="kpi-stat-doing-wrap">
                <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
                <span>Đang làm: <b id="stat-doing-tasks" class="font-bold text-slate-900 dark:text-white font-mono text-sm px-1 rounded transition-colors">0</b></span>
              </span>
              <span class="flex items-center gap-1.5 px-2 py-1 rounded-md transition-all duration-300" id="kpi-stat-done-wrap">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <span>Hoàn thành: <b id="stat-done-tasks" class="font-bold text-slate-900 dark:text-white font-mono text-sm px-1 rounded transition-colors">0</b></span>
              </span>
            </div>

            <!-- Thanh tiến độ tổng hợp chạy mượt mà -->
            <div class="flex items-center gap-3 min-w-[200px]" id="kpi-progress-container">
              <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Tiến độ:</span>
              <div class="flex-1 h-2.5 rounded-full bg-slate-200 dark:bg-white/10 overflow-hidden shadow-inner">
                <div id="stat-progress-bar" class="h-full bg-gradient-to-r from-indigo-500 via-violet-500 to-emerald-500 rounded-full kpi-bar-smooth" style="width: 0%"></div>
              </div>
              <span id="stat-progress-percent" class="font-bold font-mono text-emerald-600 dark:text-emerald-400 text-sm min-w-[38px] text-right">0%</span>
            </div>
          </div>
        </section>

        <!-- ====================================================================
             4. BẢNG KANBAN WORKSPACE (CSS GRID 3 CỘT RESPONSIVE)
             Desktop: Grid 3 cột; Mobile/Tablet: Tự động snap-scroll ngang
             ==================================================================== -->
        <section class="relative">
          <div class="kanban-board" id="kanbanBoard">
            
            <!-- CỘT 1: CHỜ THỰC HIỆN (TO-DO) -->
            <div class="kanban-column column-todo" data-status="todo" id="column-todo">
              <div class="kanban-header">
                <div class="kanban-title-wrap">
                  <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                  <h2 class="kanban-title">Chờ Thực Hiện (To-do)</h2>
                  <span class="badge badge-todo font-mono text-xs font-bold" id="count-todo">0</span>
                </div>
                <button 
                  type="button" 
                  class="btn-quick-add p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-white/5 transition-colors"
                  data-status="todo"
                  title="Thêm nhanh việc vào cột Chờ làm"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                </button>
              </div>

              <!-- Danh sách task có thể kéo thả (Drop Zone) -->
              <div class="kanban-list custom-scroll" id="kanban-list-todo" data-status="todo">
                <!-- Nạp động qua JS với hiệu ứng Slide-down Fade-in & Keyword Highlight -->
              </div>
            </div>

            <!-- CỘT 2: ĐANG THỰC HIỆN (IN-PROGRESS / DOING) -->
            <div class="kanban-column column-doing" data-status="doing" id="column-doing">
              <div class="kanban-header">
                <div class="kanban-title-wrap">
                  <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
                  <h2 class="kanban-title">Đang Làm (In-Progress)</h2>
                  <span class="badge badge-doing font-mono text-xs font-bold" id="count-doing">0</span>
                </div>
                <button 
                  type="button" 
                  class="btn-quick-add p-1.5 rounded-lg text-slate-400 hover:text-sky-600 dark:hover:text-sky-400 hover:bg-slate-100 dark:hover:bg-white/5 transition-colors"
                  data-status="doing"
                  title="Thêm nhanh việc vào cột Đang làm"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                </button>
              </div>

              <!-- Danh sách task có thể kéo thả (Drop Zone) -->
              <div class="kanban-list custom-scroll" id="kanban-list-doing" data-status="doing">
                <!-- Nạp động qua JS với hiệu ứng Slide-down Fade-in & Keyword Highlight -->
              </div>
            </div>

            <!-- CỘT 3: ĐÃ HOÀN THÀNH (DONE) -->
            <div class="kanban-column column-done" data-status="done" id="column-done">
              <div class="kanban-header">
                <div class="kanban-title-wrap">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                  <h2 class="kanban-title">Đã Hoàn Thành (Done)</h2>
                  <span class="badge badge-done font-mono text-xs font-bold" id="count-done">0</span>
                </div>
                <span class="text-[10px] uppercase tracking-wider text-emerald-600 dark:text-emerald-400 font-bold px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">
                  +100% Progress
                </span>
              </div>

              <!-- Danh sách task có thể kéo thả (Drop Zone) -->
              <div class="kanban-list custom-scroll" id="kanban-list-done" data-status="done">
                <!-- Nạp động qua JS với hiệu ứng Slide-down Fade-in & Keyword Highlight -->
              </div>
            </div>

          </div>
        </section>

      </main>
    </div>
  </div>

  <!-- ========================================================================
       5. MODAL FORM: THÊM MỚI / CHỈNH SỬA CÔNG VIỆC (TASK MODAL)
       ======================================================================== -->
  <div 
    id="taskModal" 
    class="glass-modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTaskTitle"
  >
    <div class="glass-card bg-white/95 dark:bg-slate-900/95 border border-slate-200 dark:border-white/10 p-6 rounded-2xl w-full max-w-xl shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scroll animate-modal-enter">
      
      <!-- Tiêu đề Modal & Nút đóng -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-white/10 mb-5">
        <div class="flex items-center gap-2.5">
          <span class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          </span>
          <h3 id="modalTaskTitle" class="text-base font-bold text-slate-900 dark:text-white">Thêm Công Việc Mới</h3>
        </div>
        <button 
          type="button" 
          id="btnCloseTaskModal" 
          class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/5 transition-colors"
          title="Đóng modal"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Form nhập liệu Task -->
      <form id="taskForm" class="space-y-4">
        <input type="hidden" id="taskFormId" value="" />

        <!-- Tên Task -->
        <div>
          <label for="taskInputTitle" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Tên Công Việc <span class="text-rose-500">*</span>
          </label>
          <input 
            type="text" 
            id="taskInputTitle" 
            required 
            placeholder="VD: Xây dựng module thanh toán học phí VNPay QR" 
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
          />
        </div>

        <!-- Mô tả chi tiết -->
        <div>
          <label for="taskInputDesc" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Mô Tả Nhiệm Vụ
          </label>
          <textarea 
            id="taskInputDesc" 
            rows="3" 
            placeholder="Mô tả yêu cầu kỹ thuật, tài liệu API hoặc tiêu chuẩn hoàn thành..." 
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
          ></textarea>
        </div>

        <!-- Chọn Dự án & Trạng thái khởi tạo -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="taskInputProject" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Dự Án Thuộc Về <span class="text-rose-500">*</span>
            </label>
            <select 
              id="taskInputProject" 
              required 
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            >
              <!-- Nạp danh sách dự án động -->
            </select>
          </div>

          <div>
            <label for="taskInputStatus" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Trạng Thái Ban Đầu
            </label>
            <select 
              id="taskInputStatus" 
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            >
              <option value="todo">Chờ thực hiện (To-do)</option>
              <option value="doing">Đang làm (In-Progress)</option>
              <option value="done">Đã hoàn thành (Done)</option>
            </select>
          </div>
        </div>

        <!-- Mức độ ưu tiên & Người phụ trách -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="taskInputPriority" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Mức Độ Ưu Tiên <span class="text-rose-500">*</span>
            </label>
            <select 
              id="taskInputPriority" 
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            >
              <option value="medium">⚡ Medium (Bình thường)</option>
              <option value="critical">🚨 Critical (Khẩn cấp)</option>
              <option value="high">🔥 High (Cao)</option>
              <option value="low">🌱 Low (Thấp)</option>
            </select>
          </div>

          <div>
            <label for="taskInputAssignee" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Thành Viên Phụ Trách <span class="text-rose-500">*</span>
            </label>
            <select 
              id="taskInputAssignee" 
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            >
              <!-- Nạp danh sách thành viên động -->
            </select>
          </div>
        </div>

        <!-- Thời gian: Bắt đầu & Hạn chót -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="taskInputStart" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Ngày Giờ Bắt Đầu
            </label>
            <input 
              type="datetime-local" 
              id="taskInputStart" 
              class="w-full px-3 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            />
          </div>

          <div>
            <label for="taskInputDue" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Hạn Chót (Deadline) <span class="text-rose-500">*</span>
            </label>
            <input 
              type="datetime-local" 
              id="taskInputDue" 
              required 
              class="w-full px-3 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            />
          </div>
        </div>

        <!-- Số giờ ước lượng & Tags -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="taskInputHours" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Ước Lượng (Giờ)
            </label>
            <input 
              type="number" 
              id="taskInputHours" 
              min="0.5" 
              step="0.5" 
              value="8" 
              placeholder="VD: 8" 
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            />
          </div>

          <div>
            <label for="taskInputTags" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Thẻ Nhãn (Tags, phân cách bằng dấu phẩy)
            </label>
            <input 
              type="text" 
              id="taskInputTags" 
              placeholder="Frontend, API, Security" 
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
            />
          </div>
        </div>

        <!-- Các nút Submit / Cancel -->
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200 dark:border-white/10 mt-6">
          <button 
            type="button" 
            id="btnCancelTaskModal" 
            class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-300 font-semibold text-sm hover:bg-slate-100 dark:hover:bg-white/5 transition-colors"
          >
            Hủy Bỏ
          </button>
          <button 
            type="submit" 
            id="btnSaveTask" 
            class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center min-w-[130px]"
          >
            <span id="btnSaveTaskText">Lưu Công Việc</span>
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- Toast Notification Container chuẩn Glassmorphism -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>
